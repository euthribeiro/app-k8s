apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  ConnectionStrings__Database: {{ printf "Host=%s;Port=%v;Database=%s;Username=%s;Password=%s;SSL Mode=Require;Trust Server Certificate=true;" .Values.database.host (.Values.database.port | default 5432) .Values.database.name .Values.database.user .Values.database.password | quote }}
  JwtOptions__Secret: {{ required "jwt.signingKey é obrigatório: informe via --set a partir do secret JWT_SIGNING_KEY" .Values.jwt.signingKey | quote }}
  JwtOptions__Issuer: {{ .Values.jwt.issuer | quote }}
  JwtOptions__Audience: {{ .Values.jwt.audience | quote }}
  JwtOptions__ExpirationMinutes: {{ .Values.jwt.expirationMinutes | quote }}

  EmailOptions__FromAddress: {{ .Values.application.no_reply.email }}
  AWS__Region: {{ .Values.application.credentials.aws.region }}

  ASPNETCORE_ENVIRONMENT: {{ .Values.application.environment }}
  ADMIN_EMAIL: {{ .Values.application.admin.email }}
  ADMIN_PASSWORD: {{ required "application.admin.password é obrigatório: informe via --set a partir de um secret do pipeline" .Values.application.admin.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-credentials
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.newRelic.otlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.newRelic.otlpProtocol | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ printf "api-key=%s" .Values.newRelic.licenseKey | quote }}
