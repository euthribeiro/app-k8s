name: .NET Core CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # O build, os testes, o gate de cobertura e a análise do SonarCloud vivem no workflow
  # reutilizável do infra-k8s, compartilhado pelos três microsserviços da Fase 4.
  build-and-test:
    uses: euthribeiro/infra-k8s/.github/workflows/dotnet-service-ci.yml@master
    secrets: inherit
    with:
      solution: wrench.auto.repair/wrench.auto.repair.sln
      cobertura_minima: 80
      cobertura_assembly_filtros: '+wrench.auto.repair.*;+wrench.web.api;-*.tests;-*.test'
      cobertura_classe_filtros: '-*.Migrations.*;-Program;-*.Program;-Wrench.Contracts.*;-Microsoft.AspNetCore.OpenApi.Generated;-System.Runtime.CompilerServices*'
      sonar_project_key: euthribeiro_app-k8s
      sonar_organization: euthribeiro
      sonar_exclusions: '**/Migrations/**,**/obj/**,**/bin/**,**/Program.cs'
      helm_chart: ./wrench-api-k8s
      helm_lint_args: >-
        --set api.image.repository=exemplo
        --set api.image.tag=0.0.0
        --set httpRoute.hostname=exemplo.bgt3.com.br
        --set database.host=exemplo
        --set database.name=exemplo
        --set database.user=exemplo
        --set database.password=exemplo
        --set application.admin.password=exemplo
        --set jwt.signingKey=exemplo
