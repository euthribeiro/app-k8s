name: Destruir ambiente da aplicação

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite DESTRUIR para remover o ambiente desta branch (develop: homologacao, master: production)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: app-k8s-ambiente-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/master' && 'production' || 'homologacao' }}

    env:
      OUTPUTS_DIR: ./.github/terraform-outputs
      ENVIRONMENT: ${{ github.ref == 'refs/heads/master' && 'production' || 'homologacao' }}
      RELEASE: ${{ github.ref == 'refs/heads/master' && 'wrench' || 'wrench-hml' }}

    steps:
      - name: Validar confirmação e branch
        env:
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$CONFIRMACAO" != "DESTRUIR" ]; then
            echo "::error::Confirmação inválida. Digite DESTRUIR para prosseguir."
            exit 1
          fi
          case "$GITHUB_REF" in
            refs/heads/master|refs/heads/develop) ;;
            *)
              echo "::error::Dispare este workflow a partir de develop (homologacao) ou master (production)."
              exit 1
              ;;
          esac
          echo "### Destruição do ambiente $ENVIRONMENT (release $RELEASE)" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
          terraform_wrapper: false

      - name: Ler nome do cluster
        id: infra
        run: |
          terraform -chdir="$OUTPUTS_DIR" init -input=false
          if terraform -chdir="$OUTPUTS_DIR" apply -auto-approve -input=false \
            -var="tfc_organization=${{ vars.TFC_ORGANIZATION }}" \
            -var="infra_workspace=${{ vars.TFC_WORKSPACE_INFRA }}" \
            -var="rds_workspace=${{ vars.TFC_WORKSPACE_RDS }}" \
            -var="email_workspace=${{ vars.TFC_WORKSPACE_EMAIL }}" \
            -var="ecr_workspace=${{ vars.TFC_WORKSPACE_ECR }}"; then
            echo "cluster_name=$(terraform -chdir="$OUTPUTS_DIR" output -raw cluster_name)" >> "$GITHUB_OUTPUT"
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "- Outputs de infraestrutura indisponíveis: nada a remover no cluster." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configurar credenciais AWS
        if: steps.infra.outputs.existe == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verificar cluster
        id: cluster
        if: steps.infra.outputs.existe == 'true'
        env:
          CLUSTER_NAME: ${{ steps.infra.outputs.cluster_name }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          if aws eks describe-cluster --name "$CLUSTER_NAME" > /dev/null 2>&1; then
            aws eks update-kubeconfig --region "$REGION" --name "$CLUSTER_NAME"
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            echo "- Cluster $CLUSTER_NAME não existe: nada a remover." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Helm CLI
        if: steps.cluster.outputs.existe == 'true'
        uses: azure/setup-helm@v5

      - name: Remover release e namespace
        if: steps.cluster.outputs.existe == 'true'
        run: |
          if helm status "$RELEASE" -n "$ENVIRONMENT" > /dev/null 2>&1; then
            helm uninstall "$RELEASE" -n "$ENVIRONMENT" --wait --timeout 10m
            echo "- Release $RELEASE removido do namespace $ENVIRONMENT." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release $RELEASE não encontrado no namespace $ENVIRONMENT." >> "$GITHUB_STEP_SUMMARY"
          fi
          kubectl delete namespace "$ENVIRONMENT" --ignore-not-found --wait --timeout=10m
          echo "- Namespace $ENVIRONMENT removido." >> "$GITHUB_STEP_SUMMARY"
